server:
  servlet:
    context-path: /api
spring:
  application:
    name: spring-boot-boilerplate
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  thymeleaf:
    mode: HTML
  profiles:
    active: develop
  datasource:
    hikari:
      auto-commit: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.vndat00.springbootboilerplate.config.PostgreSqlCustomDialect
        type: trace
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
        batch_size: 25
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        enable_lazy_load_no_trans: true
  flyway:
    enabled: true
    locations: classpath:db/migration
